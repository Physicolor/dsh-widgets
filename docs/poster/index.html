<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>harness-widget</title>
<style>
  :root{
    --bg:#05070d;
    --line:rgba(255,255,255,.09);
    --text:#f5f7fb;
    --text-2:#9aa7bd;
    --text-3:#5d6b84;
    --blue:#4d6bfe;
    --cyan:#4fd8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  .stage{
    position:relative;width:min(1920px,100vw);aspect-ratio:16/9;overflow:hidden;
    background:
      radial-gradient(1300px 640px at 76% -8%,rgba(77,107,254,.22),transparent 60%),
      radial-gradient(900px 500px at 4% 112%,rgba(79,216,255,.10),transparent 55%),
      linear-gradient(180deg,#070b16 0%,#0a101f 100%);
    border-radius:24px;box-shadow:0 40px 120px rgba(0,0,0,.55);
  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:58px 58px;pointer-events:none;
    -webkit-mask-image:radial-gradient(120% 90% at 70% 40%,#000 30%,transparent 80%);
            mask-image:radial-gradient(120% 90% at 70% 40%,#000 30%,transparent 80%);
  }
  .top{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:32px 56px;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand .word{font-size:22px;font-weight:700;letter-spacing:.3px}
  .brand .tag{margin-left:12px;font-size:14px;font-weight:500;color:var(--text-3);letter-spacing:.5px;padding-top:2px}
  .hero{
    position:absolute;top:0;left:0;bottom:0;width:46%;overflow:visible;
    display:flex;flex-direction:column;justify-content:center;
    padding:20px 56px 20px 60px;z-index:4;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;width:fit-content;
    padding:8px 18px;border-radius:999px;
    background:rgba(77,107,254,.12);border:1px solid rgba(77,107,254,.30);
    color:#a8bdff;font-size:13px;font-weight:600;letter-spacing:2.4px;margin-bottom:24px;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  h1{
    font-size:92px;line-height:1.08;font-weight:700;letter-spacing:-2px;padding-bottom:28px;margin-bottom:0;
    background:linear-gradient(120deg,#ffffff 0%,#d4e0ff 45%,#7fa8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    font-size:34px;font-weight:600;letter-spacing:-.5px;line-height:1.2;
    background:linear-gradient(120deg,#eef3ff 0%,#a9c2ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px;
  }
  .lead{font-size:19px;line-height:1.75;color:var(--text-2);max-width:540px;margin-bottom:32px}
  .features{display:flex;flex-direction:column;gap:14px}
  .feat{display:flex;align-items:center;gap:14px;font-size:17px;color:var(--text)}
  .feat .ic{
    width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(77,107,254,.15);border:1px solid rgba(77,107,254,.22);color:#bcd2ff;
  }
  .feat .tx small{display:block;font-size:13px;color:var(--text-3);margin-top:2px;letter-spacing:.2px}
  .demo{
    position:absolute;top:50%;right:5%;transform:translateY(-50%);
    height:90%;z-index:4;
  }
  .demo img{
    height:100%;width:auto;display:block;
    -webkit-mask-image:linear-gradient(to right,transparent 0%,transparent 15%,rgba(0,0,0,.3) 30%,rgba(0,0,0,.7) 42%,rgba(0,0,0,1) 55%,rgba(0,0,0,1) 100%);
            mask-image:linear-gradient(to right,transparent 0%,transparent 15%,rgba(0,0,0,.3) 30%,rgba(0,0,0,.7) 42%,rgba(0,0,0,1) 55%,rgba(0,0,0,1) 100%);
  }
</style>
</head>

      <span class="word">harness-widget</span>
      <span class="tag">for DeepSeek-Harness</span>
    </div>
  </div>
  <div class="hero">
    <div class="eyebrow"><span class="dot"></span>INTELLIGENT WIDGET SYSTEM</div>
    <h1>harness<br>widget</h1>
    <div class="sub">A Beautiful Widget System<br>for DeepSeek-Harness</div>
