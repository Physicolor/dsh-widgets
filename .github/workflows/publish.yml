# npm Trusted Publishing (OIDC) — publish WITHOUT an npm token.
#
# Trigger: pushing a `v*` tag (e.g. v1.4.1) to the default branch.
#
# How it works:
#   1. The npm registry validates this workflow's OIDC identity against the
#      "Trusted Publisher" configured on npmjs.com for the dsh-widgets package
#      (publisher, repo, and workflow FILENAME must match what you entered
#      there — this file is `.github/workflows/publish.yml`).
#   2. The npm CLI (>= 11.5.1) detects the OIDC environment and authenticates
#      automatically; NO NPM_SECRET / NODE_AUTH_TOKEN is needed, and 2FA/OTP
#      is bypassed by design (short-lived workflow-scoped tokens only).
#
# Requirements (see https://docs.npmjs.com/trusted-publishers/):
#   - npm CLI >= 11.5.1 and Node >= 22.14.0 (ensured by the steps below).
#   - In the npm package settings → Trusted Publisher: choose GitHub Actions,
#     org `Physicolor`, repo `dsh-widgets`, workflow filename `publish.yml`,
#     and (since 2026-09-03) explicitly ALLOW `npm publish` — the default only
#     permits `npm stage publish`.

name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # >= 22.14.0 required by trusted publishing
          registry-url: https://registry.npmjs.org/

      # Latest npm always satisfies the >= 11.5.1 CLI requirement
      - name: Ensure up-to-date npm CLI
        run: npm install -g npm@latest

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build bundles (registry + tsdown)
        run: pnpm run build

      - name: Verify widget registry is up to date
        run: node scripts/gen-registry.mjs --check

      - name: Verify sysinfo route contract (self-contained)
        run: node docs/verify-sysinfo.mjs

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public